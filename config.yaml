      - https://www.lemonde.fr/economie/rss_full.xml
      - https://www.lefigaro.fr/rss/figaro_economie.xml
  - nom: Auto
    slug: auto
    quota: 1
    photos_defaut: ["Electric car charging", "Station-service France", "Autoroute France"]
    filtre: 'voiture|automobil|carburant|essence|gazole|diesel|prix à la pompe|électrique|electrique|bonus écologique|bonus ecologique|malus|leasing social|péage|peage|permis|contrôle technique|controle technique|assurance auto|radar|\bzfe\b'
